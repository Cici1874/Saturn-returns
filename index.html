.splash-content{position:relative;z-index:1;text-align:center;padding:0 32px}
.splash-icon{width:160px;height:160px;border-radius:50%;object-fit:cover;margin-bottom:24px;box-shadow:0 0 40px rgba(107,76,138,.4),0 0 80px rgba(107,76,138,.15);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 40px rgba(107,76,138,.3),0 0 80px rgba(107,76,138,.1)}50%{box-shadow:0 0 60px rgba(107,76,138,.5),0 0 120px rgba(107,76,138,.2)}}
.splash-title{font-family:'Space Mono',monospace;font-size:28px;color:var(--text-bright);letter-spacing:2px;margin-bottom:8px}
.splash-sub{font-size:14px;color:var(--text-dim);margin-bottom:32px;letter-spacing:1px}
.splash-quote{font-size:15px;color:var(--text);line-height:1.8;margin-bottom:40px;font-style:italic}
.splash-btn{background:transparent;border:1px solid var(--accent);color:var(--accent-light);padding:12px 36px;border-radius:24px;font-size:14px;font-family:'Space Mono',monospace;cursor:pointer;letter-spacing:1px;transition:all .3s}
.splash-btn:hover{background:var(--accent);color:var(--bg)}

/* ===== PARTICLES ===== */
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;background:rgba(107,76,138,.15);animation:orbit linear infinite}
@keyframes orbit{0%{transform:rotate(0deg) translateX(var(--r)) rotate(0deg);opacity:.3}50%{opacity:.6}100%{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg);opacity:.3}}

/* ===== NAV ===== */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:linear-gradient(transparent,var(--bg) 20%);padding:8px 0 env(safe-area-inset-bottom,8px)}
.nav-inner{display:flex;justify-content:center;gap:4px;max-width:400px;margin:0 auto}
.nav-btn{flex:1;background:transparent;border:none;color:var(--text-dim);padding:10px 0 6px;font-size:10px;font-family:'Noto Sans SC',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .2s}
.nav-btn.active{color:var(--accent-light)}
.nav-btn .icon{font-size:20px}
.nav-arc{position:absolute;top:0;left:50%;transform:translateX(-50%);width:200px;height:2px;background:linear-gradient(90deg,transparent,var(--accent-dim),transparent);animation:arcGlow 6s ease-in-out infinite}
@keyframes arcGlow{0%,100%{opacity:.3}50%{opacity:.7}}

/* ===== PAGES ===== */
.page{display:none;padding:16px 16px 80px;max-width:480px;margin:0 auto;position:relative;z-index:1}
.page.active{display:block}

.hero-label{font-size:11px;color:var(--accent-light);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.hero-text{font-size:15px;line-height:1.8;color:var(--text)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:var(--surface);border-radius:var(--radius-sm);padding:14px 10px;text-align:center}
.stat-num{font-family:'Space Mono',monospace;font-size:24px;color:var(--text-bright)}
.stat-label{font-size:11px;color:var(--text-dim);margin-top:4px}
.section{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.section-title{font-size:12px;color:var(--accent-light);letter-spacing:1px;margin-bottom:10px;font-family:'Space Mono',monospace}
.quote-text{font-size:14px;line-height:1.8;color:var(--text);font-style:italic}
.countdown-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(107,76,138,.1)}
.countdown-item:last-child{border:none}
.countdown-name{font-size:14px;color:var(--text)}
.countdown-days{font-family:'Space Mono',monospace;font-size:16px;color:var(--accent-light)}

/* ===== ENEMY LIST ===== */
.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sort-select{background:var(--surface);border:1px solid var(--accent-dim);color:var(--text);padding:6px 10px;border-radius:var(--radius-sm);font-size:12px;font-family:'Noto Sans SC',sans-serif}
.sort-select option{background:var(--bg)}
.enemy-card{background:var(--surface);border-radius:var(--radius);padding:14px 14px 14px 18px;margin-bottom:10px;border-left:4px solid var(--accent-dim);cursor:pointer;transition:transform .15s,box-shadow .15s}
.enemy-card:active{transform:scale(.98)}
.enemy-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.enemy-name{font-size:16px;font-weight:500;color:var(--text-bright)}
.enemy-level{font-family:'Space Mono',monospace;font-size:11px;padding:3px 8px;border-radius:4px;color:var(--text-bright)}
.enemy-meta{display:flex;gap:8px;flex-wrap:wrap}
.enemy-tag{font-size:11px;color:var(--text-dim);background:rgba(107,76,138,.1);padding:2px 8px;border-radius:4px}
.enemy-status{font-size:11px;padding:2px 8px;border-radius:4px;color:var(--text-bright)}
.fab{position:fixed;bottom:80px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--bg);border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 20px rgba(107,76,138,.4);z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.fab:active{transform:scale(.9)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.5}
.empty-state p{font-size:14px;line-height:1.6}

/* ===== MODALS ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px 16px env(safe-area-inset-bottom,20px);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:16px;font-weight:500;color:var(--text-bright)}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:24px;cursor:pointer;padding:4px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--text-dim);margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--surface);border:1px solid var(--accent-dim);color:var(--text);padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;font-family:'Noto Sans SC',sans-serif}
.form-input:focus{outline:none;border-color:var(--accent)}
textarea.form-input{min-height:80px;resize:vertical}
.form-row{display:flex;gap:8px}
.form-row>*{flex:1}
.level-picker{display:flex;gap:6px}
.level-opt{flex:1;padding:10px 4px;text-align:center;background:var(--surface);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;font-size:11px;color:var(--text-dim)}
.level-opt.selected{border-color:var(--accent-light);color:var(--text-bright)}
.status-picker{display:flex;gap:6px;flex-wrap:wrap}
.status-opt{padding:8px 12px;background:var(--surface);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text-dim);transition:all .2s}
.status-opt.selected{border-color:var(--accent-light);color:var(--text-bright)}
.diff-picker{display:flex;flex-direction:column;gap:6px}
.diff-opt{padding:10px 12px;background:var(--surface);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text-dim);transition:all .2s}
.diff-opt.selected{border-color:var(--accent-light);color:var(--text-bright)}
.depth-picker{display:flex;gap:8px}
.depth-opt{flex:1;padding:10px;text-align:center;background:var(--surface);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text-dim);transition:all .2s}
.depth-opt.selected{border-color:var(--accent-light);color:var(--text-bright)}
.tag-grid{display:flex;flex-wrap:wrap;gap:6px}
.tag-chip{padding:6px 10px;background:var(--surface);border:1px solid var(--accent-dim);border-radius:16px;cursor:pointer;font-size:12px;color:var(--text-dim);transition:all .2s}
.tag-chip.selected{background:rgba(107,76,138,.2);border-color:var(--accent);color:var(--text-bright)}
.submit-btn{width:100%;padding:14px;background:var(--accent);color:var(--bg);border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;font-family:'Noto Sans SC',sans-serif;margin-top:8px}
.submit-btn:active{opacity:.8}
.delete-btn{width:100%;padding:12px;background:transparent;border:1px solid var(--danger);color:#a04060;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;margin-top:8px}

.detail-banner-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--bg))}
.detail-banner-content{position:relative;z-index:1}
.detail-name{font-size:22px;font-weight:500;color:var(--text-bright)}
.detail-level-tag{font-family:'Space Mono',monospace;font-size:11px;padding:3px 8px;border-radius:4px;display:inline-block;margin-top:4px}
.detail-section{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.detail-label{font-size:11px;color:var(--text-dim);margin-bottom:4px;font-family:'Space Mono',monospace}
.detail-value{font-size:14px;color:var(--text);line-height:1.6}
.phil-comment{background:var(--surface2);border-radius:var(--radius);padding:14px;margin-bottom:10px;border-left:3px solid var(--accent)}
.phil-header{font-size:11px;color:var(--accent-light);margin-bottom:6px;font-family:'Space Mono',monospace}
.phil-text{font-size:13px;color:var(--text);line-height:1.7}
.task-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(107,76,138,.08)}
.task-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--accent-dim);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.task-check.done{background:var(--accent);border-color:var(--accent)}
.task-check.done::after{content:'✓';color:var(--bg);font-size:12px}
.task-text{font-size:13px;color:var(--text);flex:1}
.task-text.done{text-decoration:line-through;color:var(--text-dim)}
.progress-bar{height:4px;background:var(--surface);border-radius:2px;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.diary-entry{padding:10px 0;border-bottom:1px solid rgba(107,76,138,.08)}
.diary-date{font-size:11px;color:var(--text-dim);font-family:'Space Mono',monospace}
.diary-text{font-size:13px;color:var(--text);margin-top:4px;line-height:1.6}
.action-row{display:flex;gap:8px;margin-bottom:10px}
.action-btn{flex:1;padding:10px;background:var(--surface);border:1px solid var(--accent-dim);color:var(--text);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;text-align:center;font-family:'Noto Sans SC',sans-serif}
.action-btn:active{background:var(--accent-dim)}
.level-history{padding:8px 0}
.level-change{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--text-dim)}

/* ===== MBTI ===== */
.mbti-section{background:var(--surface2);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.mbti-result{font-family:'Space Mono',monospace;font-size:28px;color:var(--accent-light);text-align:center;margin:12px 0}
.fortune-block{margin-bottom:12px}
.fortune-label{font-size:11px;color:var(--accent);margin-bottom:4px;font-family:'Space Mono',monospace}
.fortune-text{font-size:13px;color:var(--text);line-height:1.7}
.trait-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.trait-chip{padding:6px 10px;background:var(--surface);border:1px solid var(--accent-dim);border-radius:16px;cursor:pointer;font-size:12px;color:var(--text-dim);transition:all .2s}
.trait-chip.selected{background:rgba(107,76,138,.2);border-color:var(--accent);color:var(--text-bright)}

/* ===== ACHIEVEMENTS ===== */
.achieve-card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;opacity:.4;transition:opacity .3s}
.achieve-card.unlocked{opacity:1}
.achieve-icon{font-size:28px;flex-shrink:0}
.achieve-info{flex:1}
.achieve-name{font-size:14px;font-weight:500;color:var(--text-bright);margin-bottom:2px}
.achieve-desc{font-size:12px;color:var(--text-dim)}
.achieve-unlock{font-size:12px;color:var(--accent-light);margin-top:4px;font-style:italic}

/* ===== TOAST ===== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--accent);color:var(--bg);padding:12px 20px;border-radius:var(--radius);font-size:13px;z-index:300;transition:transform .4s ease;max-width:90%;text-align:center;box-shadow:0 4px 20px rgba(107,76,138,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== DATA MANAGEMENT ===== */
.data-btns{display:flex;gap:8px}
.data-btn{flex:1;padding:10px;background:var(--surface);border:1px solid var(--accent-dim);color:var(--text-dim);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;text-align:center}
.data-btn:active{background:var(--accent-dim)}

/* ===== SHARE CARD ===== */
.share-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:250;display:none;align-items:center;justify-content:center;padding:20px}
.share-overlay.show{display:flex}
.share-img-wrap{text-align:center;max-height:85vh;overflow:auto}
.share-img-wrap img{width:100%;max-height:85vh;border-radius:var(--radius);object-fit:contain}
.share-close{margin-top:12px;background:transparent;border:1px solid var(--text-dim);color:var(--text);padding:10px 24px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px}

.footer{text-align:center;padding:20px 0;font-size:11px;color:var(--text-dim);opacity:.5}

.trait-chip{padding:4px 10px;background:var(--surface2);border:1px solid var(--accent-dim);border-radius:12px;font-size:11px;color:var(--text-dim);cursor:pointer;transition:all .2s}
.trait-chip.selected{border-color:var(--accent-light);color:var(--text-bright);background:rgba(107,76,138,.15)}
.tag-chip{padding:4px 10px;background:var(--surface2);border:1px solid var(--accent-dim);border-radius:12px;font-size:11px;color:var(--text-dim);cursor:pointer;transition:all .2s;display:inline-block;margin:2px}
.tag-chip.selected{border-color:var(--accent-light);color:var(--text-bright);background:rgba(107,76,138,.15)}
.level-opt{padding:8px 12px;background:var(--surface);border:2px solid var(--accent-dim);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text-dim);transition:all .2s;display:inline-block;margin:2px}
.level-opt.selected{border-color:var(--accent-light);color:var(--text-bright)}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<div class="modal-title" id="formTitle">新增仇人</div>
<button class="modal-close" onclick="closeModal('formModal')">&times;</button>
</div>
<div class="form-group">
<label class="form-label">代号</label>
<input class="form-input" id="fName" placeholder="给他一个代号">
</div>
<div class="form-group">
<label class="form-label">憎恨等级</label>
<div class="level-picker" id="fLevel" style="display:flex;flex-wrap:wrap;gap:6px"></div>
</div>
<div class="form-group">
<label class="form-label">状态</label>
<div class="status-picker" id="fStatus" style="display:flex;flex-wrap:wrap;gap:6px"></div>
</div>
<div class="form-group">
<label class="form-label">伤害深度</label>
<div class="status-picker" id="fDepth" style="display:flex;flex-wrap:wrap;gap:6px"></div>
</div>
<div class="form-group">
<label class="form-label">复仇难度</label>
<div class="status-picker" id="fDiff" style="display:flex;flex-wrap:wrap;gap:6px"></div>
</div>
<div class="form-group">
<label class="form-label">仇人现状</label>
<div class="status-picker" id="fPhysStatus" style="display:flex;flex-wrap:wrap;gap:6px"></div>
</div>
<div class="form-group">
<label class="form-label">结仇时间</label>
<input class="form-input" id="fTime" type="date">
</div>
<div class="form-group">
<label class="form-label">目标日期（选填）</label>
<input class="form-input" id="fDate" type="date">
</div>
<div class="form-group">
<label class="form-label">行为特征（选3-4个）</label>
<div id="traitGrid" style="display:flex;flex-wrap:wrap;gap:6px"></div>
</div>
<div class="form-group">
<label class="form-label">已知MBTI（选填）</label>
<input class="form-input" id="fMbti" placeholder="如 ESTJ，留空则自动推断" maxlength="4" style="text-transform:uppercase">
</div>
<div class="form-group">
<label class="form-label">记仇原因</label>
<textarea class="form-input" id="fReason" placeholder="写下来。写详细。"></textarea>
</div>
<div class="form-group">
<label class="form-label">报复计划（选填）</label>
<textarea class="form-input" id="fPlan" placeholder="怎么收拾"></textarea>
</div>
<button class="submit-btn" onclick="saveEnemy()">记入档案</button>
<button class="delete-btn" id="deleteBtn" style="display:none" onclick="deleteEnemy()">永久销毁此档案</button>
</div>
</div>

  lastVisitDate = today;
  localStorage.setItem('sr_consec', consecutiveDays);
  localStorage.setItem('sr_lastvisit', lastVisitDate);
  if(consecutiveDays >= 30) tryUnlock('daily_patrol');

  createParticles();
  setupNav();
  renderDashboard();
  renderList();
  renderAchievements();
  checkChangelog();

  // Firebase auth + sync (non-blocking, UI already rendered with local data)
  try {
    const userCred = await auth.signInAnonymously();
    const uid = userCred.user.uid;
    userDoc = db.collection('users').doc(uid);
    firebaseReady = true;
    // Try to load from Firestore
    const snap = await userDoc.get();
    if(snap.exists) {
      const cloud = snap.data();
      // Merge strategy: if cloud has more enemies or local is empty, use cloud
      if(cloud.enemies && (enemies.length === 0 || cloud.lastSaved > (localStorage.getItem('sr_lastSaved') || ''))) {
        enemies = cloud.enemies;
        unlocked = cloud.unlocked || [];
        visitCount = cloud.visitCount || visitCount;
        consecutiveDays = cloud.consecutiveDays || consecutiveDays;
        lastVisitDate = cloud.lastVisitDate || lastVisitDate;
        shownQuotes = cloud.shownQuotes || shownQuotes;
        // Update localStorage
        saveToLocal();
        // Re-render with cloud data
        renderDashboard();
        renderList();
        renderAchievements();
      }
    } else {
      // First time on this device with this uid - push local data to cloud
      if(enemies.length > 0) saveToCloud();
    }
  } catch(err) {
    console.log('Firebase offline mode, using localStorage:', err.message);
  }
}

// ============ UTILS ============
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function daysSince(d){ return Math.floor((Date.now()-new Date(d).getTime())/86400000); }
function daysUntil(d){ return Math.ceil((new Date(d).getTime()-Date.now())/86400000); }
function fmtNow(){ return new Date().toISOString().slice(0,16).replace('T',' '); }
function esc(s){ if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML; }

function seededQuote() {
  const quotes = APP_DATA.quotes;
  // Anti-repeat: track shown indices
  if(shownQuotes.length >= quotes.length) shownQuotes = [];
  const available = quotes.map((_,i)=>i).filter(i => !shownQuotes.includes(i));
  const day = Math.floor(Date.now()/86400000);
  const idx = available[day % available.length];
  if(!shownQuotes.includes(idx)) {
    shownQuotes.push(idx);
    localStorage.setItem('sr_shown_quotes', JSON.stringify(shownQuotes));
  }
  return quotes[idx];
}

// ============ DASHBOARD ============
function renderDashboard() {
  const total = enemies.length;
  const archived = enemies.filter(e => e.status === 'archived').length;
  const orbiting = enemies.filter(e => e.status === 'orbiting').length;
  const perihelion = enemies.filter(e => e.status === 'perihelion').length;
  const lurking = enemies.filter(e => e.status === 'lurking').length;
  const avgLevel = total ? (enemies.reduce((s,e) => s + e.level, 0) / total).toFixed(1) : '0';
  const traumaCount = enemies.filter(e => e.damageLevel === 'trauma' || e.trauma).length;

  document.getElementById('weatherText').textContent = getWeather();

  // Stats grid
  document.getElementById('statsGrid').innerHTML = [
    ['总仇人', total],
    ['已归档', archived],
    ['排期中', orbiting],
    ['执行中', perihelion],
    ['按兵不动', lurking],
    ['平均憎恨', avgLevel]
  ].map(([label, val]) => `<div class="stat-card"><div class="stat-num">${val}</div><div class="stat-label">${label}</div></div>`).join('');

  // Countdown
  const upcoming = enemies.filter(e => e.targetDate && e.status !== 'archived')
    .map(e => ({name: e.name, days: daysUntil(e.targetDate)}))
    .filter(x => x.days > 0).sort((a,b) => a.days - b.days).slice(0,2);
  const countdownSection = document.getElementById('countdownSection');
  const countdownList = document.getElementById('countdownList');
  if(upcoming.length) {
    countdownSection.style.display = '';
    countdownList.innerHTML = upcoming.map(u => `<div class="countdown-item"><span class="countdown-name">${esc(u.name)}</span><span class="countdown-days">${u.days}天</span></div>`).join('');
  } else {
    countdownSection.style.display = 'none';
  }

  document.getElementById('dailyQuote').textContent = seededQuote();
}

function getWeather() {
  const w = APP_DATA.weather;
  if(enemies.length === 0) return w.find(x => x.cond === 'empty').text;
  const active = enemies.filter(e => e.status !== 'archived');
  if(active.length === 0) return w.find(x => x.cond === 'all_archived').text;
  const avg = active.reduce((s,e) => s+e.level, 0) / active.length;
  const lurk = active.filter(e => e.status === 'lurking').length;
  const hasTrauma = enemies.some(e => e.damageLevel === 'trauma' || e.trauma);
  const hasCountdown = enemies.some(e => e.targetDate && daysUntil(e.targetDate) > 0 && daysUntil(e.targetDate) <= 7);
  if(avg >= 4) return w.find(x => x.cond === 'high_avg').text;
  if(hasTrauma && avg >= 3) return w.find(x => x.cond === 'has_trauma').text;
  if(hasCountdown) return w.find(x => x.cond === 'countdown').text;
  if(lurk > active.length * 0.7) return w.find(x => x.cond === 'mostly_lurking').text;
  if(avg >= 2.5) return w.find(x => x.cond === 'mid_avg').text;
  return w.find(x => x.cond === 'default').text;
}

// ============ ENEMY LIST ============
function renderList() {
  const sortBy = document.getElementById('sortSelect')?.value || 'level';
  const sorted = [...enemies].sort((a,b) => {
    if(sortBy === 'level') return b.level - a.level;
    if(sortBy === 'time') return new Date(b.createdAt||0) - new Date(a.createdAt||0);
    if(sortBy === 'hatred_time') return new Date(b.hatredTime||0) - new Date(a.hatredTime||0);
    if(sortBy === 'difficulty') return DIFFICULTY_LIST.indexOf(b.difficulty) - DIFFICULTY_LIST.indexOf(a.difficulty);
    if(sortBy === 'urgency') {
      const da = a.targetDate ? daysUntil(a.targetDate) : 9999;
      const db = b.targetDate ? daysUntil(b.targetDate) : 9999;
      return da - db;
    }
    if(sortBy === 'record_date') return new Date(b.createdAt||0) - new Date(a.createdAt||0);
    return 0;
  });
  const list = document.getElementById('enemyList');
  if(!sorted.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🪐</div><p>清算名单为空。<br>不是因为善良，是还没遇到该记的人。</p></div>';
    return;
  }
  list.innerHTML = sorted.map(e => {
    const lv = APP_DATA.levels[e.level];
    const st = STATUS_LIST.find(s => s.key === e.status) || STATUS_LIST[0];
    const physLabel = e.physicalStatus && e.physicalStatus !== 'alive' ? (' · ' + (PHYS_STATUS.find(p=>p.key===e.physicalStatus)||{}).label || '') : '';
    return `<div class="enemy-card" style="border-left-color:${lv.color}" onclick="openDetail('${e.id}')">
      <div class="enemy-top">
        <span class="enemy-name">${esc(e.name)}</span>
        <span class="enemy-level" style="background:${lv.color}">${e.level} ${lv.name}</span>
      </div>
      <div class="enemy-meta">
        <span class="enemy-status" style="background:${st.color}">${st.icon} ${st.label}${physLabel}</span>
        ${(e.tags||[]).slice(0,3).map(t => `<span class="enemy-tag">${esc(t)}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function saveEnemy() {
  const name = document.getElementById('fName').value.trim();
  if(!name) { showToast('至少给个代号'); return; }
  const level = parseInt(document.querySelector('#fLevel .selected')?.dataset.val || '3');
  const status = document.querySelector('#fStatus .selected')?.dataset.val || 'lurking';
  const damageLevel = document.querySelector('#fDepth .selected')?.dataset.val || 'normal_sb';
  const trauma = (damageLevel === 'trauma');
  const difficulty = document.querySelector('#fDiff .selected')?.textContent.trim() || DIFFICULTY_LIST[0];
  const physicalStatus = document.querySelector('#fPhysStatus .selected')?.dataset.val || 'alive';
  const traits = [...document.querySelectorAll('#traitGrid .selected')].map(c => c.textContent.trim());
  const tags = traits; // traits double as tags now
  const mbtiInput = document.getElementById('fMbti').value.trim().toUpperCase();
  const mbti = mbtiInput.length === 4 ? mbtiInput : inferMBTI(traits);
  const hatredTime = document.getElementById('fTime').value.trim();
  const reason = document.getElementById('fReason').value.trim();
  const plan = document.getElementById('fPlan').value.trim();
  const targetDate = document.getElementById('fDate').value || null;

  if(editingId) {
    const e = enemies.find(x => x.id === editingId);
    if(!e) return;
    const oldLevel = e.level;
    const oldStatus = e.status;
    Object.assign(e, {name, level, status, damageLevel, trauma, difficulty, physicalStatus, tags, traits, mbti,
      hatredTime, reason, plan, targetDate, updatedAt: new Date().toISOString()});
    if(oldLevel !== level) {
      e.levelHistory = e.levelHistory || [];
      e.levelHistory.push({from: oldLevel, to: level, date: new Date().toISOString()});
    }
    // Check#18: 归档后又调回
    if(e._wasArchived && status !== 'archived') {
      e._wasArchived = false;
      tryUnlock('knew_it');
    }
    if(status === 'archived' && oldStatus !== 'archived') {
      e._wasArchived = true;
    }
    // Check#20: 仇人现状触发送走成就
    if(physicalStatus === 'dead') tryUnlock('sent_off');
  } else {
    const newEnemy = {
      id: uid(), name, level, status, damageLevel, trauma, difficulty, physicalStatus, tags, traits, mbti,
      hatredTime, reason, plan, targetDate, relations: [],
      tasks: [], diary: [], levelHistory: [{from: 0, to: level, date: new Date().toISOString()}],
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    };
    enemies.push(newEnemy);
    checkNewEnemyAchievements(newEnemy);
  }
  save(); closeModal('formModal'); renderDashboard(); renderList(); renderAchievements();
  showToast(editingId ? '已更新' : '已加入清算名单 🪐');
}

function deleteEnemy() {
  if(!editingId) return;
  if(!confirm('确定删除？档案一旦销毁无法恢复。')) return;
  enemies = enemies.filter(e => e.id !== editingId);
  editingId = null;
  save(); closeModal('formModal'); renderDashboard(); renderList(); renderAchievements();
  showToast('已从名单中移除');
}

// ============ MBTI INFERENCE ============
function inferMBTI(traits) {
  if(!traits || !traits.length) return null;
  const scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  traits.forEach(t => {
    const map = APP_DATA.behaviorTraits[t];
    if(map) Object.entries(map).forEach(([k,v]) => scores[k] += v);
  });
  let result = '';
  result += scores.E >= scores.I ? 'E' : 'I';
  result += scores.S >= scores.N ? 'S' : 'N';
  result += scores.T >= scores.F ? 'T' : 'F';
  result += scores.J >= scores.P ? 'J' : 'P';
  return result;
}

      const other = enemies.find(x => x.id === r.enemyId);
      if(other) h += `<div style="padding:4px 0;font-size:13px"><span style="color:var(--accent-light);cursor:pointer" onclick="closeModal('detailModal');openDetail('${other.id}')">${esc(other.name)}</span> <span style="color:var(--text-dim)">${esc(r.desc)}</span></div>`;
    });
    h += `</div>`;
  }

  // Physical status Phil comment
  if(e.physicalStatus && e.physicalStatus !== 'alive' && APP_DATA.phil.physStatus[e.physicalStatus]) {
    h += `<div class="section" style="margin-top:12px"><div class="section-title">🐾 Phil 对此人现状的评价</div>
    <div style="font-size:13px;color:var(--text);line-height:1.8;font-style:italic">${esc(APP_DATA.phil.physStatus[e.physicalStatus])}</div></div>`;
  }

  // Phil comment
  const philText = getPhilComment(e);
  if(philText) {
    h += `<div class="section" style="margin-top:12px"><div class="section-title">🐾 Phil 点评</div>
    <div style="font-size:13px;color:var(--text);line-height:1.8;font-style:italic">${esc(philText)}</div></div>`;
  }

  document.getElementById('detailContent').innerHTML = h;
  openModal('detailModal');
}

function changeStatus(id, newStatus) {
  const e = enemies.find(x => x.id === id);
  if(!e) return;
  const oldStatus = e.status;
  e.status = newStatus;
  e.updatedAt = new Date().toISOString();
  // Check#17: Lv5归档 = 比你想象的大度
  if(newStatus === 'archived' && e.level === 5) tryUnlock('generous_jk');
  if(newStatus === 'archived') {
    tryUnlock('first_archive');
    e._wasArchived = true;
    // Check speed archive
    if(e.createdAt && (Date.now() - new Date(e.createdAt).getTime()) < 86400000) tryUnlock('speed_archive');
  }
  if(oldStatus === 'archived' && newStatus !== 'archived') {
    tryUnlock('knew_it');
  }
  // Check all archived
  if(enemies.length > 0 && enemies.every(x => x.status === 'archived')) tryUnlock('all_archived');
  save(); openDetail(id); renderDashboard(); renderList(); renderAchievements();
}

function getPhilComment(e) {
  const pc = APP_DATA.phil;
  let pool = [];
  if(e.status === 'archived') pool = pc.released;
  else if(e.damageLevel === 'trauma' || e.trauma) pool = pc.trauma;
  else if(e.level >= 4) pool = pc.high;
  else if(e.level === 3) pool = pc.mid;
  else pool = pc.low;
  if(!pool || !pool.length) return null;
  const seed = e.id.split('').reduce((a,c) => a + c.charCodeAt(0), 0);
  return pool[seed % pool.length];
}

function toggleTask(id, idx) {
  const e = enemies.find(x => x.id === id);
  if(!e) return;
  e.tasks[idx].done = !e.tasks[idx].done;
  save(); openDetail(id);
}

function addTask(id) {
  const inp = document.getElementById('newTask');
  const v = inp.value.trim();
  if(!v) return;
  const e = enemies.find(x => x.id === id);
  if(!e) return;
  e.tasks = e.tasks || [];
  e.tasks.push({text: v, done: false});
  save(); openDetail(id);
}

function addDiary(id) {
  const inp = document.getElementById('diaryInput');
  const v = inp.value.trim();
  if(!v) return;
  const e = enemies.find(x => x.id === id);
  if(!e) return;
  e.diary = e.diary || [];
  e.diary.push({text: v, date: fmtNow()});
  save(); openDetail(id);
  if(e.diary.length >= 5) tryUnlock('diary_5');
  if(e.diary.length >= 10) tryUnlock('diary_10');
}

// ============ ACHIEVEMENTS ============
function getAchCount(id) { return unlocked.filter(x => x === id).length; }

function renderAchievements() {
  const totalPoints = unlocked.length;
  const rank = getRank(totalPoints);
  let h = `<div style="text-align:center;padding:16px 0;cursor:pointer" onclick="showRankCard()">
    <div style="font-size:28px">${rank.icon}</div>
    <div style="font-family:'Space Mono',monospace;font-size:16px;color:var(--accent-light);margin:4px 0">${rank.name}</div>
    <div style="font-size:11px;color:var(--text-dim)">成就积分: ${totalPoints} · 点击查看段位</div>
  </div>`;
  APP_DATA.achievements.forEach(a => {
    const count = getAchCount(a.id);
    const got = count > 0;
    const isCum = a.cumulative;
    h += `<div style="display:flex;gap:12px;align-items:center;padding:12px;background:${got?'var(--surface)':'var(--surface2)'};border-radius:var(--radius-sm);margin-bottom:8px;opacity:${got?1:0.5}">
      <span style="font-size:24px">${a.icon}</span>
      <div style="flex:1"><div style="font-size:14px;color:var(--text-bright)">${esc(a.name)}${isCum && count>1 ? ' <span style="color:var(--accent-light)">×'+count+'</span>' : ''}</div><div style="font-size:11px;color:var(--text-dim)">${esc(a.desc)}</div></div>
      ${got ? '<span style="color:var(--accent-light);font-size:12px">✓</span>' : ''}
    </div>`;
  });
  document.getElementById('achieveList').innerHTML = h;
}

function tryUnlock(achId) {
  const a = APP_DATA.achievements.find(x => x.id === achId);
  if(!a) return;
  if(!a.cumulative && unlocked.includes(achId)) return;
  unlocked.push(achId);
  saveToLocal();
  saveToCloud();
  const count = getAchCount(achId);
  showToast(`${a.icon} 成就${a.cumulative && count > 1 ? '再次' : ''}解锁：${a.name}${count > 1 ? ' ×' + count : ''}`);
}

function checkNewEnemyAchievements(e) {
  tryUnlock('first_enemy');
  if(e.level === 5) tryUnlock('max_level');
  if(enemies.length >= 5) tryUnlock('five_enemies');
  if(enemies.length >= 20) tryUnlock('twenty_enemies');
  if(enemies.length >= 50) tryUnlock('fifty_enemies');
  // Night planner
  const h = new Date().getHours();
  if(h >= 0 && h < 5) tryUnlock('night_planner');
  // Serial grudge
  const oneWeekAgo = Date.now() - 7*86400000;
  const recentCount = enemies.filter(x => new Date(x.createdAt).getTime() > oneWeekAgo).length;
  if(recentCount >= 3) tryUnlock('serial_grudge');
  // WTF today
  const today = new Date().toISOString().slice(0,10);
  const todayCount = enemies.filter(x => x.createdAt && x.createdAt.slice(0,10) === today).length;
  if(todayCount >= 3) tryUnlock('wtf_today');
  // Long memory (Change #5: use hatredTime instead of createdAt)
  enemies.forEach(x => {
    if(x.hatredTime && daysSince(x.hatredTime) >= 365) tryUnlock('old_grudge');
  });
  // Too much trauma
  if(enemies.length > 0 && enemies.every(x => x.damageLevel === 'trauma' || x.trauma)) tryUnlock('too_much');
  // Sent off
  if(e.physicalStatus === 'dead') tryUnlock('sent_off');
  // INFP essay
  if(e.reason && e.reason.length >= 200) tryUnlock('infp_essay');
  // Full evolution check (Change #16)
  enemies.forEach(x => {
    if(x.levelHistory && x.levelHistory.length >= 2) {
      const levels = x.levelHistory.map(l => l.to);
      if(levels.includes(1) && levels.includes(5)) {
        const idx1 = levels.indexOf(1);
        const idx5 = levels.lastIndexOf(5);
        if(idx5 > idx1) tryUnlock('full_evolution');
      }
    }
  });
  // Lurker check
  if(visitCount >= 10 && enemies.length === 0) tryUnlock('lurker');
}

// ============ SHARE CARD (Change #1: improved layout) ============
function generateShareCard(id) {
  const e = id ? enemies.find(x => x.id === id) : null;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const SCALE = 2; // retina scale
  const W = 400, H = 560;
  canvas.width = W * SCALE; canvas.height = H * SCALE;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

  const bgImg = new Image();
  bgImg.onload = function() {
    // Draw bg at full physical resolution, then scale for rest
    drawCover(ctx, bgImg, W * SCALE, H * SCALE);
    ctx.scale(SCALE, SCALE);
    ctx.fillStyle = 'rgba(15,15,26,0.82)';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(107,76,138,0.3)';
    ctx.lineWidth = 2;
    ctx.strokeRect(12,12,W-24,H-24);
    ctx.textAlign = 'center';

    if(e) {
      ctx.font = 'bold 14px "Space Mono",monospace';
      ctx.fillStyle = '#8b6aae';
      ctx.fillText('SATURN RETURNS', W/2, 42);
      ctx.font = 'bold 28px sans-serif';
      ctx.fillStyle = '#e0d8ea';
      ctx.fillText(e.name, W/2, 85);
      ctx.font = '16px "Space Mono",monospace';
      ctx.fillStyle = '#8b6aae';
      ctx.fillText('Lv'+e.level+' '+LEVEL_LABELS[e.level], W/2, 115);
      const stObj = STATUS_LIST.find(s=>s.key===e.status)||STATUS_LIST[0];
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#8a8494';
      ctx.fillText(stObj.icon+' '+stObj.label, W/2, 140);
      const dpObj = APP_DATA.depths.find(d=>d.id===(e.damageLevel||e.depth));
      if(dpObj) { ctx.font = '14px sans-serif'; ctx.fillText(dpObj.name, W/2, 162); }
      if(e.mbti) {
        ctx.font = 'bold 26px "Space Mono",monospace';
        ctx.fillStyle = '#6b4c8a';
        ctx.fillText(e.mbti, W/2, 205);
      }
      const phil = getPhilComment(e);
      if(phil) {
        const philY = e.mbti ? 230 : 190;
        ctx.fillStyle = 'rgba(26,26,46,0.6)';
        ctx.fillRect(20, philY, W-40, 160);
        ctx.font = '13px sans-serif';
        ctx.fillStyle = '#b0a8c0';
        wrapText(ctx, '🐾 ' + phil, W/2, philY + 26, W-70, 20);
      }
    } else {
      ctx.font = 'bold 16px "Space Mono",monospace';
      ctx.fillStyle = '#8b6aae';
      ctx.fillText('SATURN RETURNS', W/2, 50);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#8a8494';
      ctx.fillText('摩羯女因果清算系统', W/2, 80);
      ctx.font = 'bold 64px "Space Mono",monospace';
      ctx.fillStyle = '#e0d8ea';
      ctx.fillText(String(enemies.length), W/2, 180);
      ctx.font = '16px sans-serif';
      ctx.fillStyle = '#8a8494';
      ctx.fillText('个仇人', W/2, 210);
      const archived = enemies.filter(e=>e.status==='archived').length;
      const avgLvl = enemies.length ? (enemies.reduce((s,e)=>s+e.level,0)/enemies.length).toFixed(1) : '0';
      ctx.font = 'bold 32px "Space Mono",monospace';
      ctx.fillStyle = '#8b6aae'; ctx.fillText(String(archived), W/4, 300);
      ctx.fillStyle = '#6b4c8a'; ctx.fillText(avgLvl, W*3/4, 300);
      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#8a8494';
      ctx.fillText('已归档', W/4, 325);
      ctx.fillText('平均憎恨', W*3/4, 325);
    }

    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#8b6aae';
    ctx.fillText('恨比爱长久 · Saturn Returns', W/2, H-60);
    ctx.font = '12px "Space Mono",monospace';
    ctx.fillStyle = 'rgba(138,132,148,0.8)';
    ctx.fillText('该系统由跟摩羯女一样阴暗的双鱼女开发', W/2, H-35);

    document.getElementById('shareImg').src = canvas.toDataURL('image/png');
    document.getElementById('shareOverlay').classList.add('show');
  };
  bgImg.src = CARD_BG;
}

function drawCover(ctx, img, cw, ch) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const scale = Math.max(cw/iw, ch/ih);
  const sw = cw/scale, sh = ch/scale;
  const sx = (iw-sw)/2, sy = (ih-sh)/2;
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  let line = '';
  for(const ch of text) {
    line += ch;
    if(ctx.measureText(line).width > maxW) {
      ctx.fillText(line, x, y);
      y += lineH;
      line = '';
    }
  }
  if(line) ctx.fillText(line, x, y);
}

function generateDashCard() { generateShareCard(null); }

// ============ DATA ============
function save() {
  saveToLocal();
  saveToCloud();
}

function saveToLocal() {
  localStorage.setItem('sr_enemies', JSON.stringify(enemies));
  localStorage.setItem('sr_unlocked', JSON.stringify(unlocked));
  localStorage.setItem('sr_lastSaved', new Date().toISOString());
}

function saveToCloud() {
  if(!firebaseReady || !userDoc) return;
  userDoc.set({
    enemies,
    unlocked,
    visitCount,
    consecutiveDays,
    lastVisitDate,
    shownQuotes,
    lastSaved: new Date().toISOString()
  }).catch(err => console.log('Cloud save failed:', err.message));
}

function exportData() {
  const data = {enemies, unlocked, exportDate: new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'saturn-returns-backup.json';
  a.click();
  tryUnlock('export');
}

function importData(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const d = JSON.parse(e.target.result);
      if(d.enemies) { enemies = d.enemies; }
      if(d.unlocked) { unlocked = d.unlocked; }
      save();
      renderDashboard(); renderList(); renderAchievements();
      showToast('数据已恢复。');
    } catch(err) { showToast('导入失败：文件格式错误'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}
