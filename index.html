.splash-content{position:relative;z-index:1;text-align:center;padding:0 32px}
.splash-icon{width:160px;height:160px;border-radius:50%;object-fit:cover;margin-bottom:24px;box-shadow:0 0 40px rgba(107,76,138,.4),0 0 80px rgba(107,76,138,.15);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 40px rgba(107,76,138,.3),0 0 80px rgba(107,76,138,.1)}50%{box-shadow:0 0 60px rgba(107,76,138,.5),0 0 120px rgba(107,76,138,.2)}}
.splash-title{font-family:'Space Mono',monospace;font-size:28px;color:var(--text-bright);letter-spacing:2px;margin-bottom:8px}
.splash-sub{font-size:14px;color:var(--text-dim);margin-bottom:32px;letter-spacing:1px}
.splash-quote{font-size:15px;color:var(--text);line-height:1.8;margin-bottom:40px;font-style:italic}
.splash-btn{background:transparent;border:1px solid var(--accent);color:var(--accent-light);padding:12px 36px;border-radius:24px;font-size:14px;font-family:'Space Mono',monospace;cursor:pointer;letter-spacing:1px;transition:all .3s}
.splash-btn:hover{background:var(--accent);color:var(--bg)}

/* ===== PARTICLES ===== */
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;background:rgba(107,76,138,.15);animation:orbit linear infinite}
@keyframes orbit{0%{transform:rotate(0deg) translateX(var(--r)) rotate(0deg);opacity:.3}50%{opacity:.6}100%{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg);opacity:.3}}

/* ===== NAV ===== */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:linear-gradient(transparent,var(--bg) 20%);padding:8px 0 env(safe-area-inset-bottom,8px)}
.nav-inner{display:flex;justify-content:center;gap:4px;max-width:400px;margin:0 auto}
.nav-btn{flex:1;background:transparent;border:none;color:var(--text-dim);padding:10px 0 6px;font-size:10px;font-family:'Noto Sans SC',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .2s}
.nav-btn.active{color:var(--accent-light)}
.nav-btn .icon{font-size:20px}
.nav-arc{position:absolute;top:0;left:50%;transform:translateX(-50%);width:200px;height:2px;background:linear-gradient(90deg,transparent,var(--accent-dim),transparent);animation:arcGlow 6s ease-in-out infinite}
@keyframes arcGlow{0%,100%{opacity:.3}50%{opacity:.7}}

/* ===== PAGES ===== */
.page{display:none;padding:16px 16px 80px;max-width:480px;margin:0 auto;position:relative;z-index:1}
.page.active{display:block}

.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,15,26,.3),rgba(15,15,26,.9))}
.hero-content{position:relative;z-index:1}
.hero-label{font-size:11px;color:var(--accent-light);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.hero-text{font-size:15px;line-height:1.8;color:var(--text)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:var(--surface);border-radius:var(--radius-sm);padding:14px 10px;text-align:center}
.stat-num{font-family:'Space Mono',monospace;font-size:24px;color:var(--text-bright)}
.stat-label{font-size:11px;color:var(--text-dim);margin-top:4px}
.section{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.section-title{font-size:12px;color:var(--accent-light);letter-spacing:1px;margin-bottom:10px;font-family:'Space Mono',monospace}
.quote-text{font-size:14px;line-height:1.8;color:var(--text);font-style:italic}
.countdown-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(107,76,138,.1)}
.countdown-item:last-child{border:none}
.countdown-name{font-size:14px;color:var(--text)}
.countdown-days{font-family:'Space Mono',monospace;font-size:16px;color:var(--accent-light)}

/* ===== ENEMY LIST ===== */
.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sort-select{background:var(--surface);border:1px solid var(--accent-dim);color:var(--text);padding:6px 10px;border-radius:var(--radius-sm);font-size:12px;font-family:'Noto Sans SC',sans-serif}
.sort-select option{background:var(--bg)}
.enemy-card{background:var(--surface);border-radius:var(--radius);padding:14px 14px 14px 18px;margin-bottom:10px;border-left:4px solid var(--accent-dim);cursor:pointer;transition:transform .15s,box-shadow .15s}
.enemy-card:active{transform:scale(.98)}
.enemy-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.enemy-name{font-size:16px;font-weight:500;color:var(--text-bright)}
.enemy-level{font-family:'Space Mono',monospace;font-size:11px;padding:3px 8px;border-radius:4px;color:var(--text-bright)}
.enemy-meta{display:flex;gap:8px;flex-wrap:wrap}
.enemy-tag{font-size:11px;color:var(--text-dim);background:rgba(107,76,138,.1);padding:2px 8px;border-radius:4px}
.enemy-status{font-size:11px;padding:2px 8px;border-radius:4px;color:var(--text-bright)}
.fab{position:fixed;bottom:80px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--bg);border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 20px rgba(107,76,138,.4);z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.fab:active{transform:scale(.9)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.5}
.empty-state p{font-size:14px;line-height:1.6}

/* ===== MODALS ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px 16px env(safe-area-inset-bottom,20px);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:16px;font-weight:500;color:var(--text-bright)}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:24px;cursor:pointer;padding:4px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--text-dim);margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--surface);border:1px solid var(--accent-dim);color:var(--text);padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;font-family:'Noto Sans SC',sans-serif}
.form-input:focus{outline:none;border-color:var(--accent)}
textarea.form-input{min-height:80px;resize:vertical}
.form-row{display:flex;gap:8px}
.form-row>*{flex:1}
.level-picker{display:flex;gap:6px}
.level-opt{flex:1;padding:10px 4px;text-align:center;background:var(--surface);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;font-size:11px;color:var(--text-dim)}
.level-opt.selected{border-color:var(--accent-light);color:var(--text-bright)}
.status-picker{display:flex;gap:6px;flex-wrap:wrap}
.status-opt{padding:8px 12px;background:var(--surface);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text-dim);transition:all .2s}
.status-opt.selected{border-color:var(--accent-light);color:var(--text-bright)}
.diff-picker{display:flex;flex-direction:column;gap:6px}
.diff-opt{padding:10px 12px;background:var(--surface);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text-dim);transition:all .2s}
.diff-opt.selected{border-color:var(--accent-light);color:var(--text-bright)}
.depth-picker{display:flex;gap:8px}
.depth-opt{flex:1;padding:10px;text-align:center;background:var(--surface);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text-dim);transition:all .2s}
.depth-opt.selected{border-color:var(--accent-light);color:var(--text-bright)}
.tag-grid{display:flex;flex-wrap:wrap;gap:6px}
.tag-chip{padding:6px 10px;background:var(--surface);border:1px solid var(--accent-dim);border-radius:16px;cursor:pointer;font-size:12px;color:var(--text-dim);transition:all .2s}
.tag-chip.selected{background:rgba(107,76,138,.2);border-color:var(--accent);color:var(--text-bright)}
.submit-btn{width:100%;padding:14px;background:var(--accent);color:var(--bg);border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;font-family:'Noto Sans SC',sans-serif;margin-top:8px}
.submit-btn:active{opacity:.8}
.delete-btn{width:100%;padding:12px;background:transparent;border:1px solid var(--danger);color:#a04060;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;margin-top:8px}

.detail-banner-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--bg))}
.detail-banner-content{position:relative;z-index:1}
.detail-name{font-size:22px;font-weight:500;color:var(--text-bright)}
.detail-level-tag{font-family:'Space Mono',monospace;font-size:11px;padding:3px 8px;border-radius:4px;display:inline-block;margin-top:4px}
.detail-section{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.detail-label{font-size:11px;color:var(--text-dim);margin-bottom:4px;font-family:'Space Mono',monospace}
.detail-value{font-size:14px;color:var(--text);line-height:1.6}
.phil-comment{background:var(--surface2);border-radius:var(--radius);padding:14px;margin-bottom:10px;border-left:3px solid var(--accent)}
.phil-header{font-size:11px;color:var(--accent-light);margin-bottom:6px;font-family:'Space Mono',monospace}
.phil-text{font-size:13px;color:var(--text);line-height:1.7}
.task-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(107,76,138,.08)}
.task-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--accent-dim);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.task-check.done{background:var(--accent);border-color:var(--accent)}
.task-check.done::after{content:'✓';color:var(--bg);font-size:12px}
.task-text{font-size:13px;color:var(--text);flex:1}
.task-text.done{text-decoration:line-through;color:var(--text-dim)}
.progress-bar{height:4px;background:var(--surface);border-radius:2px;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.diary-entry{padding:10px 0;border-bottom:1px solid rgba(107,76,138,.08)}
.diary-date{font-size:11px;color:var(--text-dim);font-family:'Space Mono',monospace}
.diary-text{font-size:13px;color:var(--text);margin-top:4px;line-height:1.6}
.action-row{display:flex;gap:8px;margin-bottom:10px}
.action-btn{flex:1;padding:10px;background:var(--surface);border:1px solid var(--accent-dim);color:var(--text);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;text-align:center;font-family:'Noto Sans SC',sans-serif}
.action-btn:active{background:var(--accent-dim)}
.level-history{padding:8px 0}
.level-change{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--text-dim)}

/* ===== MBTI ===== */
.mbti-section{background:var(--surface2);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.mbti-result{font-family:'Space Mono',monospace;font-size:28px;color:var(--accent-light);text-align:center;margin:12px 0}
.fortune-block{margin-bottom:12px}
.fortune-label{font-size:11px;color:var(--accent);margin-bottom:4px;font-family:'Space Mono',monospace}
.fortune-text{font-size:13px;color:var(--text);line-height:1.7}
.trait-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.trait-chip{padding:6px 10px;background:var(--surface);border:1px solid var(--accent-dim);border-radius:16px;cursor:pointer;font-size:12px;color:var(--text-dim);transition:all .2s}
.trait-chip.selected{background:rgba(107,76,138,.2);border-color:var(--accent);color:var(--text-bright)}

/* ===== ACHIEVEMENTS ===== */
.achieve-card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;opacity:.4;transition:opacity .3s}
.achieve-card.unlocked{opacity:1}
.achieve-icon{font-size:28px;flex-shrink:0}
.achieve-info{flex:1}
.achieve-name{font-size:14px;font-weight:500;color:var(--text-bright);margin-bottom:2px}
.achieve-desc{font-size:12px;color:var(--text-dim)}
.achieve-unlock{font-size:12px;color:var(--accent-light);margin-top:4px;font-style:italic}

/* ===== TOAST ===== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--accent);color:var(--bg);padding:12px 20px;border-radius:var(--radius);font-size:13px;z-index:300;transition:transform .4s ease;max-width:90%;text-align:center;box-shadow:0 4px 20px rgba(107,76,138,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== DATA MANAGEMENT ===== */
.data-btns{display:flex;gap:8px}
.data-btn{flex:1;padding:10px;background:var(--surface);border:1px solid var(--accent-dim);color:var(--text-dim);border-radius:var(--radius-sm);font-size:12px;cursor:pointer;text-align:center}
.data-btn:active{background:var(--accent-dim)}

/* ===== SHARE CARD ===== */
.share-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:250;display:none;align-items:center;justify-content:center;padding:20px}
.share-overlay.show{display:flex}
.share-img-wrap{text-align:center}
.share-img-wrap img{max-width:100%;border-radius:var(--radius)}
.share-close{margin-top:12px;background:transparent;border:1px solid var(--text-dim);color:var(--text);padding:10px 24px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px}

.footer{text-align:center;padding:20px 0;font-size:11px;color:var(--text-dim);opacity:.5}
</style>
</head>

let enemies = JSON.parse(localStorage.getItem('sr_enemies') || '[]');
let unlocked = JSON.parse(localStorage.getItem('sr_unlocked') || '[]');
let visitCount = parseInt(localStorage.getItem('sr_visits') || '0');
let editingId = null;

// ============ INIT ============
function init() {
  visitCount++;
  localStorage.setItem('sr_visits', visitCount);
  createParticles();
  setupNav();
  renderDashboard();
  renderList();
  renderAchievements();

}

function enterApp() {
  document.getElementById('splash').classList.add('hidden');
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('mainNav').style.display = 'block';
    document.getElementById('fabBtn').style.display = 'flex';
  }, 600);
}

// ============ PARTICLES ============
function createParticles() {
  const c = document.getElementById('particles');
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 2 + Math.random() * 4;
    const r = 60 + Math.random() * 120;
    const dur = 20 + Math.random() * 40;
    const x = 20 + Math.random() * 60;
    const y = 20 + Math.random() * 60;
    p.style.cssText = `width:${size}px;height:${size}px;left:${x}%;top:${y}%;--r:${r}px;animation-duration:${dur}s;animation-delay:${-Math.random()*dur}s`;
    c.appendChild(p);
  }
}

// ============ NAV ============
function setupNav() {
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('page-' + btn.dataset.page).classList.add('active');
      document.getElementById('fabBtn').style.display = btn.dataset.page === 'list' ? 'flex' : 'none';
    });
  });
}

// ============ DASHBOARD ============
function renderDashboard() {
  // Weather
  const w = getWeather();
  document.getElementById('weatherText').textContent = w;

  // Stats
  const total = enemies.length;
  const archived = enemies.filter(e => e.status === 'archived').length;
  const orbiting = enemies.filter(e => e.status === 'orbiting').length;
  const perihelion = enemies.filter(e => e.status === 'perihelion').length;
  const lurking = enemies.filter(e => e.status === 'lurking').length;
  const avgLv = total > 0 ? (enemies.reduce((s, e) => s + e.level, 0) / total).toFixed(1) : '—';
  const stats = [
    {n: total, l: '总仇人'}, {n: perihelion, l: '执行中'}, {n: orbiting, l: '排期中'},
    {n: archived, l: '已归档'}, {n: lurking, l: '按兵不动'}, {n: avgLv, l: '平均憎恨'}
  ];
  document.getElementById('statsGrid').innerHTML = stats.map(s =>
    `<div class="stat-card"><div class="stat-num">${s.n}</div><div class="stat-label">${s.l}</div></div>`
  ).join('');

  // Countdown
  const upcoming = enemies.filter(e => e.targetDate && e.status !== 'archived')
    .map(e => ({name: e.name, days: Math.ceil((new Date(e.targetDate) - new Date()) / 86400000)}))
    .filter(e => e.days > 0).sort((a, b) => a.days - b.days).slice(0, 3);
  const cs = document.getElementById('countdownSection');
  if (upcoming.length) {
    cs.style.display = 'block';
    document.getElementById('countdownList').innerHTML = upcoming.map(u =>
      `<div class="countdown-item"><span class="countdown-name">${u.name}</span><span class="countdown-days">${u.days}天</span></div>`
    ).join('');
  } else cs.style.display = 'none';

  // Daily quote
  const day = Math.floor(Date.now() / 86400000);
  document.getElementById('dailyQuote').textContent = APP_DATA.quotes[day % APP_DATA.quotes.length];
}

function getWeather() {
  const w = APP_DATA.weather;
  if (!enemies.length) return w.find(x => x.cond === 'empty').text;
  const active = enemies.filter(e => e.status !== 'archived');
  if (!active.length) return w.find(x => x.cond === 'all_archived').text;
  if (enemies.some(e => e.depth === 'core')) return w.find(x => x.cond === 'has_trauma').text;
  const avg = active.reduce((s, e) => s + e.level, 0) / active.length;
  const lurk = active.filter(e => e.status === 'lurking').length;
  const hasCountdown = active.some(e => e.targetDate && Math.ceil((new Date(e.targetDate) - new Date()) / 86400000) <= 7 && Math.ceil((new Date(e.targetDate) - new Date()) / 86400000) > 0);
  if (hasCountdown) return w.find(x => x.cond === 'countdown').text;
  if (lurk > active.length * 0.7) return w.find(x => x.cond === 'mostly_lurking').text;
  if (avg >= 4) return w.find(x => x.cond === 'high_avg').text;
  if (avg <= 2) return w.find(x => x.cond === 'low_avg').text;
  return w.find(x => x.cond === 'default').text;
}

// ============ ENEMY LIST ============
function renderList() {
  const sort = document.getElementById('sortSelect').value;
  let sorted = [...enemies];
  if (sort === 'level') sorted.sort((a, b) => b.level - a.level);
  else if (sort === 'time') sorted.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  else if (sort === 'difficulty') sorted.sort((a, b) => APP_DATA.difficulties.indexOf(b.difficulty) - APP_DATA.difficulties.indexOf(a.difficulty));
  else if (sort === 'urgency') sorted.sort((a, b) => {
    const da = a.targetDate ? new Date(a.targetDate) : new Date('2099-01-01');
    const db = b.targetDate ? new Date(b.targetDate) : new Date('2099-01-01');
    return da - db;
  });

  const el = document.getElementById('enemyList');
  if (!sorted.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">🪐</div><p>清算名单为空。<br>也许你是个好人。<br>也许你只是还没开始记。</p></div>`;
    return;
  }
  el.innerHTML = sorted.map(e => {
    const lv = APP_DATA.levels[e.level];
    const st = APP_DATA.statuses[e.status];
    return `<div class="enemy-card" style="border-left-color:${lv.color}" onclick="openDetail('${e.id}')">
      <div class="enemy-top">
        <span class="enemy-name">${e.name}</span>
        <span class="enemy-level" style="background:${lv.color}">${lv.name}</span>
      </div>
      <div class="enemy-meta">
        <span class="enemy-status" style="background:${st.color}">${st.emoji} ${st.name}</span>
        ${e.tags.slice(0, 3).map(t => `<span class="enemy-tag">${t}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
}

  const e = enemies.find(x => x.id === id);

  editingId = id;

  document.getElementById('submitBtn').textContent = '更新档案';
  document.getElementById('deleteBtn').style.display = 'block';
  buildFormPickers();

  document.getElementById('fDate').value = e.grudgeDate || '';

  document.getElementById('fReason').value = e.reason || '';
  document.getElementById('fPlan').value = e.plan || '';

  document.querySelectorAll('#fStatus .status-opt').forEach(o => o.classList.toggle('selected', o.dataset.val === e.status));
  document.querySelectorAll('#fDepth .depth-opt').forEach(o => o.classList.toggle('selected', o.dataset.val === e.depth));
  document.querySelectorAll('#fDiff .diff-opt').forEach(o => o.classList.toggle('selected', o.dataset.val === e.difficulty));

function buildFormPickers() {
  // Level
  document.getElementById('fLevel').innerHTML = [1,2,3,4,5].map(n => {
    const lv = APP_DATA.levels[n];
    return `<div class="level-opt" data-val="${n}" onclick="togglePick(this,'fLevel','level-opt')" style="border-bottom:3px solid ${lv.color}">${n}<br><span style="font-size:10px">${lv.name}</span></div>`;
  }).join('');
  // Status
  document.getElementById('fStatus').innerHTML = Object.entries(APP_DATA.statuses).map(([k, v]) =>
    `<div class="status-opt" data-val="${k}" onclick="togglePick(this,'fStatus','status-opt')">${v.emoji} ${v.name}</div>`
  ).join('');
  // Depth
  document.getElementById('fDepth').innerHTML = APP_DATA.depths.map(d =>
    `<div class="depth-opt" data-val="${d.id}" onclick="togglePick(this,'fDepth','depth-opt')">${d.name}</div>`
  ).join('');
  // Difficulty
  document.getElementById('fDiff').innerHTML = APP_DATA.difficulties.map(d =>
    `<div class="diff-opt" data-val="${d}" onclick="togglePick(this,'fDiff','diff-opt')">${d}</div>`
  ).join('');
  // Tags
  document.getElementById('fTags').innerHTML = APP_DATA.tags.map(t =>
    `<div class="tag-chip" data-val="${t}" onclick="this.classList.toggle('selected')">${t}</div>`
  ).join('');
}

function togglePick(el, containerId, cls) {
  document.querySelectorAll(`#${containerId} .${cls}`).forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

function clearForm() {
  ['fName','fDate','fTarget','fReason','fPlan'].forEach(id => document.getElementById(id).value = '');
}

function saveEnemy() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { showToast('代号不能为空'); return; }
  const level = parseInt(document.querySelector('#fLevel .selected')?.dataset.val || '1');
  const status = document.querySelector('#fStatus .selected')?.dataset.val || 'lurking';
  const depth = document.querySelector('#fDepth .selected')?.dataset.val || 'surface';
  const difficulty = document.querySelector('#fDiff .selected')?.dataset.val || APP_DATA.difficulties[0];
  const tags = [...document.querySelectorAll('#fTags .tag-chip.selected')].map(t => t.dataset.val);

  if (editingId) {
    const e = enemies.find(x => x.id === editingId);
    if (e) {
      if (e.level !== level) {
        e.levelHistory = e.levelHistory || [];
        e.levelHistory.push({from: e.level, to: level, date: new Date().toISOString()});
      }
      Object.assign(e, {name, level, status, depth, difficulty, tags,
        grudgeDate: document.getElementById('fDate').value,
        targetDate: document.getElementById('fTarget').value,
        reason: document.getElementById('fReason').value,
        plan: document.getElementById('fPlan').value
      });
    }
  } else {
    enemies.push({
      id: 'e' + Date.now(), name, level, status, depth, difficulty, tags,
      grudgeDate: document.getElementById('fDate').value,
      targetDate: document.getElementById('fTarget').value,
      reason: document.getElementById('fReason').value,
      plan: document.getElementById('fPlan').value,
      tasks: [], diary: [], levelHistory: [], relations: [],
      mbti: null, createdAt: new Date().toISOString()
    });
  }
  save();
  closeModal('addModal');
  renderList();
  renderDashboard();
  checkAchievements();
  showToast(editingId ? '档案已更新' : '已记入档案。土星在看。');
}

function deleteEnemy() {
  if (!editingId) return;
  if (!confirm('永久销毁此档案？（恨比爱长久，但你可以选择不再花时间恨。）')) return;
  enemies = enemies.filter(e => e.id !== editingId);
  save();
  closeModal('addModal');
  if (currentDetailId === editingId) closeModal('detailModal');
  renderList();
  renderDashboard();
  showToast('档案已销毁');
}

  const taskProg = e.tasks.length ? (e.tasks.filter(t => t.done).length / e.tasks.length * 100) : 0;

  let html = `
    <div class="detail-banner"><div class="detail-banner-bg"></div><div class="detail-banner-overlay"></div>
    <div class="detail-banner-content">
      <div class="detail-name">${e.name}</div>
      <div class="detail-level-tag" style="background:${lv.color}">${lv.name} ${e.level === 5 ? '· 恨比爱长久' : ''}</div>
    </div></div>
    <div class="action-row">
      <button class="action-btn" onclick="openEditModal('${e.id}');closeModal('detailModal')">✏️ 编辑</button>
      <button class="action-btn" onclick="openMbti('${e.id}')">🔮 算命</button>
      <button class="action-btn" onclick="generateShareCard('${e.id}')">📸 名片</button>
    </div>
    <div class="detail-section">
      <div class="detail-label">状态</div>
      <div class="detail-value">${st.emoji} ${st.name} — ${st.desc}</div>
    </div>
    <div class="detail-section">
      <div class="detail-label">伤害深度</div>
      <div class="detail-value">${dp ? dp.name + ' — ' + dp.desc : '未分类'}</div>
    </div>
    <div class="detail-section">
      <div class="detail-label">复仇难度</div>
      <div class="detail-value">${e.difficulty || '未评估'}</div>
    </div>`;

  if (e.grudgeDate) html += `<div class="detail-section"><div class="detail-label">仇的形成</div><div class="detail-value">${e.grudgeDate}</div></div>`;
  if (e.targetDate) {
    const days = Math.ceil((new Date(e.targetDate) - new Date()) / 86400000);
    html += `<div class="detail-section"><div class="detail-label">目标日期</div><div class="detail-value">${e.targetDate} (${days > 0 ? days + '天后' : '已到期'})</div></div>`;
  }
  if (e.tags.length) html += `<div class="detail-section"><div class="detail-label">标签</div><div class="detail-value">${e.tags.map(t => `<span class="enemy-tag" style="margin-right:4px">${t}</span>`).join('')}</div></div>`;
  if (e.reason) html += `<div class="detail-section"><div class="detail-label">记仇原因</div><div class="detail-value">${e.reason}</div></div>`;
  if (e.plan) html += `<div class="detail-section"><div class="detail-label">报复计划</div><div class="detail-value">${e.plan}</div></div>`;

  // Phil comment
  html += `<div class="phil-comment"><div class="phil-header">🐾 Phil · 土星法庭顾问</div><div class="phil-text">${phil}</div></div>`;

  // Tasks
  html += `<div class="detail-section"><div class="detail-label">任务拆分</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${taskProg}%"></div></div>
    <div id="taskList">${e.tasks.map((t, i) => `<div class="task-item"><div class="task-check ${t.done ? 'done' : ''}" onclick="toggleTask('${e.id}',${i})"></div><span class="task-text ${t.done ? 'done' : ''}">${t.text}</span></div>`).join('')}</div>
    <div style="margin-top:8px;display:flex;gap:6px">
      <input class="form-input" id="newTask" placeholder="添加步骤" style="font-size:12px;padding:8px">
      <button class="action-btn" style="flex:0 0 auto;padding:8px 12px" onclick="addTask('${e.id}')">+</button>
    </div>
  </div>`;

  // Diary
  html += `<div class="detail-section"><div class="detail-label">记仇日记</div>
    <div id="diaryList">${(e.diary || []).slice().reverse().map(d => `<div class="diary-entry"><div class="diary-date">${new Date(d.date).toLocaleDateString('zh-CN')}</div><div class="diary-text">${d.text}</div></div>`).join('') || '<div style="font-size:12px;color:var(--text-dim)">暂无记录</div>'}</div>
    <div style="margin-top:8px;display:flex;gap:6px">
      <input class="form-input" id="newDiary" placeholder="写日记" style="font-size:12px;padding:8px">
      <button class="action-btn" style="flex:0 0 auto;padding:8px 12px" onclick="addDiary('${e.id}')">+</button>
    </div>
  </div>`;

  // Level history
  if (e.levelHistory && e.levelHistory.length) {
    html += `<div class="detail-section"><div class="detail-label">憎恨等级变更</div>
      ${e.levelHistory.map(h => `<div class="level-change"><span>${new Date(h.date).toLocaleDateString('zh-CN')}</span><span>Lv${h.from} → Lv${h.to}</span></div>`).join('')}
    </div>`;
  }

  // MBTI result
  if (e.mbti) {
    const fort = APP_DATA.mbti_fortunes[e.mbti];
    if (fort) {
      html += `<div class="mbti-section">
        <div class="detail-label">🔮 MBTI 恶毒算命</div>
        <div class="mbti-result">${e.mbti}</div>
        <div class="fortune-block"><div class="fortune-label">人设</div><div class="fortune-text">${fort.persona}</div></div>
        <div class="fortune-block"><div class="fortune-label">命运</div><div class="fortune-text">${fort.fate}</div></div>
        <div class="fortune-block"><div class="fortune-label">前世</div><div class="fortune-text">${fort.past_life}</div></div>
        <div class="fortune-block"><div class="fortune-label">克星</div><div class="fortune-text">${fort.nemesis}</div></div>
      </div>`;
    }
  }

  document.getElementById('detailContent').innerHTML = html;
  openModal('detailModal');
}

function getPhilComment(e) {
  const pool = e.status === 'archived' ? APP_DATA.phil.released :
    e.depth === 'core' ? APP_DATA.phil.trauma :
    e.level >= 4 ? APP_DATA.phil.high :
    e.level >= 3 ? APP_DATA.phil.mid : APP_DATA.phil.low;
  const seed = e.id.split('').reduce((s, c) => s + c.charCodeAt(0), 0);
  return pool[seed % pool.length];
}

function toggleTask(id, idx) {
  const e = enemies.find(x => x.id === id);
  if (!e) return;
  e.tasks[idx].done = !e.tasks[idx].done;
  save();
  openDetail(id);
}

function addTask(id) {
  const input = document.getElementById('newTask');
  const text = input.value.trim();
  if (!text) return;
  const e = enemies.find(x => x.id === id);
  if (!e) return;
  e.tasks.push({text, done: false});
  save();
  openDetail(id);
}

function addDiary(id) {
  const input = document.getElementById('newDiary');
  const text = input.value.trim();
  if (!text) return;
  const e = enemies.find(x => x.id === id);
  if (!e) return;
  e.diary = e.diary || [];
  e.diary.push({text, date: new Date().toISOString()});
  save();
  openDetail(id);
  checkAchievements();
}

// ============ MBTI ============
function openMbti(id) {
  const e = enemies.find(x => x.id === id);
  if (!e) return;
  let html = `<div class="form-group"><label class="form-label">已知 MBTI？直接输入</label>
    <input class="form-input" id="mbtiDirect" placeholder="如 ENTJ" maxlength="4" style="text-transform:uppercase"></div>
    <div style="text-align:center;color:var(--text-dim);font-size:12px;margin:8px 0">—— 或者通过行为特征推测 ——</div>
    <div class="form-group"><label class="form-label">选 3-4 个最像他的行为</label>
    <div class="trait-grid" id="traitGrid">${APP_DATA.mbti_traits.map(t => `<div class="trait-chip" data-trait="${t.name}" onclick="this.classList.toggle('selected')">${t.name}</div>`).join('')}</div></div>
    <button class="submit-btn" onclick="calcMbti('${e.id}')">开始算命</button>`;
  document.getElementById('mbtiContent').innerHTML = html;
  openModal('mbtiModal');
}

function calcMbti(id) {
  const e = enemies.find(x => x.id === id);
  if (!e) return;
  const direct = document.getElementById('mbtiDirect').value.trim().toUpperCase();
  if (direct.length === 4 && /^[EI][SN][TF][JP]$/.test(direct)) {
    e.mbti = direct;
  } else {
    const selected = [...document.querySelectorAll('#traitGrid .trait-chip.selected')].map(c => c.dataset.trait);
    if (selected.length < 3) { showToast('至少选 3 个特征'); return; }
    const scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
    selected.forEach(name => {
      const trait = APP_DATA.mbti_traits.find(t => t.name === name);
      if (trait) Object.entries(trait.scores).forEach(([k, v]) => scores[k] += v);
    });
    e.mbti = (scores.E >= scores.I ? 'E' : 'I') + (scores.S >= scores.N ? 'S' : 'N') + (scores.T >= scores.F ? 'T' : 'F') + (scores.J >= scores.P ? 'J' : 'P');
  }
  save();
  closeModal('mbtiModal');
  openDetail(id);
  showToast(`判定结果：${e.mbti}。活该。`);
}

// ============ ACHIEVEMENTS ============
function renderAchievements() {
  document.getElementById('achieveList').innerHTML = APP_DATA.achievements.map(a => {
    const done = unlocked.includes(a.id);
    return `<div class="achieve-card ${done ? 'unlocked' : ''}">
      <div class="achieve-icon">${a.icon}</div>
      <div class="achieve-info">
        <div class="achieve-name">${a.name}</div>
        <div class="achieve-desc">${a.desc}</div>
        ${done ? `<div class="achieve-unlock">${a.unlock}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function checkAchievements() {
  const checks = {
    first_enemy: () => enemies.length >= 1,
    five_enemies: () => enemies.length >= 5,
    max_level: () => enemies.some(e => e.level === 5),
    first_archive: () => enemies.some(e => e.status === 'archived'),
    old_grudge: () => enemies.some(e => e.grudgeDate && (new Date() - new Date(e.grudgeDate)) > 365 * 86400000),
    diary_5: () => enemies.some(e => (e.diary || []).length >= 5),
    relation_3: () => enemies.filter(e => (e.relations || []).length > 0).length >= 3,
    export: () => unlocked.includes('export'),
    infp_essay: () => enemies.some(e => (e.reason || '').length >= 200),
    speed_archive: () => enemies.some(e => e.status === 'archived' && e.createdAt && (new Date() - new Date(e.createdAt)) < 86400000),
    lurker: () => visitCount >= 10 && enemies.length === 0,
    all_archived: () => enemies.length > 0 && enemies.every(e => e.status === 'archived')
  };
  let newUnlock = false;
  Object.entries(checks).forEach(([id, fn]) => {
    if (!unlocked.includes(id) && fn()) {
      unlocked.push(id);
      newUnlock = true;
      const a = APP_DATA.achievements.find(x => x.id === id);
      if (a) showToast(`🏆 ${a.name} — ${a.unlock}`);
    }
  });
  if (newUnlock) {
    localStorage.setItem('sr_unlocked', JSON.stringify(unlocked));
    renderAchievements();
  }
}

// ============ SHARE CARD ============
function generateShareCard(id) {
  const e = enemies.find(x => x.id === id);
  if (!e) return;
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 400; canvas.height = 500;
  // BG
  ctx.fillStyle = '#0f0f1a'; ctx.fillRect(0, 0, 400, 500);
  ctx.fillStyle = 'rgba(107,76,138,.15)'; ctx.fillRect(0, 0, 400, 500);
  // Border
  ctx.strokeStyle = '#6b4c8a'; ctx.lineWidth = 1; ctx.strokeRect(20, 20, 360, 460);
  // Title
  ctx.fillStyle = '#8b6aae'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
  ctx.fillText('SATURN RETURNS · 因果清算档案', 200, 50);
  // Name
  ctx.fillStyle = '#e0d8ea'; ctx.font = '600 28px sans-serif';
  ctx.fillText(e.name, 200, 110);
  // Level
  const lv = APP_DATA.levels[e.level];
  ctx.fillStyle = lv.color; ctx.font = '14px monospace';
  ctx.fillText(`Lv${e.level} · ${lv.name}`, 200, 145);
  // Status
  const st = APP_DATA.statuses[e.status];
  ctx.fillStyle = '#8a8494'; ctx.font = '13px sans-serif';
  ctx.fillText(`${st.emoji} ${st.name}`, 200, 180);
  // Phil
  ctx.fillStyle = '#c8c0d0'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
  const phil = getPhilComment(e);
  wrapText(ctx, '「' + phil + '」', 40, 220, 320, 18);
  // Footer
  ctx.fillStyle = '#8a8494'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('恨比爱长久 · Saturn Returns', 200, 460);
  ctx.fillText('该系统由跟摩羯女一样阴暗的双鱼女开发', 200, 480);
  // Show
  document.getElementById('shareImg').src = canvas.toDataURL('image/png');
  document.getElementById('shareOverlay').classList.add('show');
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  let line = '';
  for (let i = 0; i < text.length; i++) {
    const test = line + text[i];
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, y);
      line = text[i]; y += lineH;
    } else line = test;
  }
  ctx.fillText(line, x, y);
}

function closeShare() {
  document.getElementById('shareOverlay').classList.remove('show');
}

function generateDashCard() {
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 400; canvas.height = 520;
  ctx.fillStyle = '#0f0f1a'; ctx.fillRect(0, 0, 400, 520);
  ctx.fillStyle = 'rgba(107,76,138,.1)'; ctx.fillRect(0, 0, 400, 520);
  ctx.strokeStyle = '#6b4c8a'; ctx.lineWidth = 1; ctx.strokeRect(20, 20, 360, 480);
  ctx.fillStyle = '#8b6aae'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
  ctx.fillText('SATURN RETURNS', 200, 55);
  ctx.fillStyle = '#e0d8ea'; ctx.font = '600 20px sans-serif';
  ctx.fillText('摩羯女因果清算系统', 200, 90);
  const total = enemies.length;
  const archived = enemies.filter(e => e.status === 'archived').length;
  const active = total - archived;
  const avgLv = total > 0 ? (enemies.reduce((s,e) => s + e.level, 0) / total).toFixed(1) : '0';
  const maxLv = total > 0 ? Math.max(...enemies.map(e => e.level)) : 0;
  ctx.fillStyle = '#c8c0d0'; ctx.font = '14px sans-serif'; ctx.textAlign = 'left';
  const stats = [`总档案数：${total}`, `进行中：${active}`, `已归档：${archived}`, `平均憎恨：Lv${avgLv}`, `最高等级：Lv${maxLv}`];
  stats.forEach((s, i) => ctx.fillText(s, 50, 140 + i * 30));
  if (total > 0) {
    const top = [...enemies].sort((a,b) => b.level - a.level)[0];
    ctx.fillStyle = '#8b6aae'; ctx.font = '12px monospace';
    ctx.fillText('HEAD ON THE LIST', 50, 310);
    ctx.fillStyle = '#e0d8ea'; ctx.font = '500 18px sans-serif';
    ctx.fillText(top.name, 50, 340);
    ctx.fillStyle = APP_DATA.levels[top.level].color; ctx.font = '13px monospace';
    ctx.fillText(`Lv${top.level} · ${APP_DATA.levels[top.level].name}`, 50, 365);
    const phil = getPhilComment(top);
    ctx.fillStyle = '#8a8494'; ctx.font = '12px sans-serif';
    wrapText(ctx, '「' + phil.substring(0, 60) + '…」', 50, 395, 300, 17);
  }
  ctx.fillStyle = '#8a8494'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('恨比爱长久 · Saturn Returns', 200, 480);
  ctx.fillText('该系统由跟摩羯女一样阴暗的双鱼女开发', 200, 498);
  document.getElementById('shareImg').src = canvas.toDataURL('image/png');
  document.getElementById('shareOverlay').classList.add('show');
}

// ============ DATA ============
function save() {
  localStorage.setItem('sr_enemies', JSON.stringify(enemies));
}

function exportData() {
  const blob = new Blob([JSON.stringify({enemies, unlocked, visitCount}, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'saturn-returns-backup.json';
  a.click();
  if (!unlocked.includes('export')) {
    unlocked.push('export');
    localStorage.setItem('sr_unlocked', JSON.stringify(unlocked));
    checkAchievements();
  }
  showToast('备份已导出。证据链完整保存。');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const d = JSON.parse(e.target.result);
      if (d.enemies) { enemies = d.enemies; save(); }
      if (d.unlocked) { unlocked = d.unlocked; localStorage.setItem('sr_unlocked', JSON.stringify(unlocked)); }
      renderDashboard(); renderList(); renderAchievements();
      showToast('数据已恢复。');
    } catch(err) { showToast('导入失败：文件格式错误'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============ UTILS ============
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); });
});

init();
</script>
